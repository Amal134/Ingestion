services:
  # ------------------------------------------------------------ MongoDB
  mongo:
    image: mongo:8
    container_name: kbo-mongo
    restart: unless-stopped
    command:
      # zstd divise par ~4 la taille sur disque des 45 M de documents
      - --wiredTigerCollectionBlockCompressor
      - zstd
      # 3 Go, et non 6 : le cache doit cohabiter avec les 2 JVM Hadoop, Jupyter
      # et Airflow dans la meme VM. A 6 Go la VM saturait et mongod cessait de
      # repondre (port ouvert mais aucune reponse) des la premiere requete lourde.
      - --wiredTigerCacheSizeGB
      - "3"
    # Plafond dur : le cache n'est pas le seul consommateur de mongod (tri,
    # agregations, connexions). La marge au-dessus du cache absorbe ces pics.
    mem_limit: 4g
    ports:
      # 27018 cote hote : evite le conflit avec un MongoDB deja installe
      - "27018:27017"
    volumes:
      - kbo_mongo_data:/data/db
      - ../:/data/kbo:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10


  namenode:
    image: apache/hadoop:3.4
    container_name: namenode
    hostname: namenode
    user: root
    restart: unless-stopped
    command: ["hdfs", "namenode"]
    env_file: [./hadoop.env]
    environment:
      ENSURE_NAMENODE_DIR: /tmp/hadoop-root/dfs/name
    ports:
      - "9870:9870"   # WebHDFS + interface web
      - "8020:8020"   # RPC
    volumes:
      - kbo_hdfs_name:/tmp/hadoop-root/dfs/name
    mem_limit: 1500m

  datanode:
    image: apache/hadoop:3.4
    container_name: datanode
    hostname: datanode
    user: root                 # meme raison que le namenode, cf. ci-dessus
    restart: unless-stopped
    command: ["hdfs", "datanode"]
    env_file: [./hadoop.env]
    depends_on: [namenode]
    ports:
      # publie car WebHDFS redirige le client d'ecriture vers le datanode
      - "9864:9864"
    volumes:
      - kbo_hdfs_data:/tmp/hadoop-root/dfs/data
    mem_limit: 1500m

  tor1:
    image: dperson/torproxy
    container_name: tor1
    restart: unless-stopped
    environment:
      PASSWORD: ${TOR_PASSWORD:-kbotp2026}
    ports:
      - "9050:9050"   # SOCKS5
      - "9051:9051"   # ControlPort (SIGNAL NEWNYM)

  tor2:
    image: dperson/torproxy
    container_name: tor2
    restart: unless-stopped
    environment:
      PASSWORD: ${TOR_PASSWORD:-kbotp2026}
    ports:
      - "9060:9050"
      - "9061:9051"

  tor3:
    image: dperson/torproxy
    container_name: tor3
    restart: unless-stopped
    environment:
      PASSWORD: ${TOR_PASSWORD:-kbotp2026}
    ports:
      - "9070:9050"
      - "9071:9051"

  # ------------------------------------------------------------ JupyterLab
  jupyter:
    image: quay.io/jupyter/minimal-notebook:latest
    container_name: kbo-jupyter
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      KBO_DATA_DIR: /data/kbo
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: kbo
      HDFS_URL: http://namenode:9870
      HDFS_USER: root
      TOR_PASSWORD: ${TOR_PASSWORD:-kbotp2026}
      CBSO_MIN_INTERVAL: "2.0"
    ports:
      - "8888:8888"
    volumes:
      - ./:/home/jovyan/work
      - ../:/data/kbo:ro
    mem_limit: 2g
    command: >
      bash -c "pip install --quiet 'pymongo>=4.9' 'requests[socks]' hdfs stem &&
               start-notebook.py --IdentityProvider.token='' --ServerApp.root_dir=/home/jovyan/work"

  # ------------------------------------------------------------ Airflow
  # Mode `standalone` : scheduler + webserver + SQLite dans un seul conteneur.
  # Suffisant pour orchestrer un DAG sequentiel ; un vrai deploiement
  # utiliserait Postgres et un CeleryExecutor.
  airflow:
    image: apache/airflow:2.10.3
    container_name: kbo-airflow
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      _PIP_ADDITIONAL_REQUIREMENTS: "pymongo>=4.9 papermill ipykernel"
      KBO_UPDATES_ROOT: /opt/airflow/kbo
      KBO_NOTEBOOK: /opt/airflow/kbo/kbo_update_bronze_silver.ipynb
      KBO_NOTEBOOK_OUTPUT: /opt/airflow/kbo/runs
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: kbo
    ports:
      - "8080:8080"          # interface web (identifiants affiches au demarrage)
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./:/opt/airflow/kbo
    mem_limit: 1500m
    command: bash -c "airflow standalone"

volumes:
  kbo_mongo_data:
  kbo_hdfs_name:
  kbo_hdfs_data:
